name: smart_parcel_dropbox
description: "IOT-based parcel drop box for contactless deliveries. An Undergraduate Thesis."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0
  flutter_riverpod: ^2.4.0

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.0.0

  # Networking & Connectivity
  connectivity_plus: ^5.0.0
  dio: ^5.4.0

  # UI Enhancements
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0

  # Dependency Injection
  get_it: ^7.6.0

  # Functional Programming
  dartz: ^0.10.1

  # Value Equality
  equatable: ^2.0.5

  # Internationalization & Formatting
  intl: ^0.19.0

  # Error Tracking (Alternative to Crashlytics)
  # sentry_flutter: ^7.14.0

  # Icons
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  socket_io_client: ^3.1.3

  # Google Sign-In
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
