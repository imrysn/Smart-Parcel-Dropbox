<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    canvas.pixelated {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="bg-white text-slate-800 antialiased p-3 select-none">
  <div class="py-1 space-y-2">
    
    <!-- Top Header: Title & Theme Switcher Bar -->
    <div class="flex flex-wrap items-center justify-between gap-1.5 pb-1.5 border-b border-slate-200 text-xs">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="font-bold text-[var(--foreground)] tracking-wide">Tesla Sleek • Delivery Flow & Status Stager</span>
        <span class="text-[10px] px-1.5 py-0.2 rounded bg-cyan-50 text-cyan-700 border border-cyan-200 font-mono">320×240</span>
      </div>

      <!-- Theme Selector Dropdown/Chips -->
      <div class="flex items-center gap-1 overflow-x-auto text-[11px]">
        <button onclick="setTheme('tesla')" id="btn-theme-tesla" class="theme-chip px-2 py-0.5 rounded bg-cyan-600 text-white border border-cyan-600 font-semibold shadow-xs font-semibold">Tesla Sleek</button>
        <button onclick="setTheme('nordic')" id="btn-theme-nordic" class="theme-chip px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">Nordic</button>
        <button onclick="setTheme('logistics')" id="btn-theme-logistics" class="theme-chip px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">Hub Locker</button>
        <button onclick="setTheme('bento')" id="btn-theme-bento" class="theme-chip px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">Bento</button>
        <button onclick="setTheme('braun')" id="btn-theme-braun" class="theme-chip px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">Braun</button>
      </div>
    </div>

    <!-- Controls Toolbar (Flow Runner & Live Toggles) -->
    <div class="flex flex-wrap items-center justify-between gap-1.5 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs">
      <div class="flex items-center gap-1.5">
        <button onclick="runDeliveryFlow()" id="btn-run-flow" class="px-2.5 py-1 rounded bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-[11px] flex items-center gap-1 shadow-sm transition">
          <span id="flow-icon">▶</span>
          <span id="flow-txt">Delivery Flow</span>
        </button>
        <button onclick="runSetupFlow()" id="btn-run-setup-flow" class="px-2.5 py-1 rounded bg-amber-600 hover:bg-amber-500 text-white font-bold text-[11px] flex items-center gap-1 shadow-sm transition">
          <span id="setup-flow-icon">▶</span>
          <span id="setup-flow-txt">Setup Flow</span>
        </button>
        <span class="text-[10.5px] text-slate-500 font-mono" id="flow-status-badge">Idle</span>
      </div>

      <!-- Live State Simulation Toggles -->
      <div class="flex items-center gap-1 text-[11px]">
        <button onclick="toggleWifiState()" id="btn-sim-wifi" class="px-1.5 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs flex items-center gap-1">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400" id="wifi-ind"></span>
          <span id="wifi-txt">WiFi: Online</span>
        </button>
        <button onclick="toggleCloudState()" id="btn-sim-cloud" class="px-1.5 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs flex items-center gap-1">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400" id="cloud-ind"></span>
          <span id="cloud-txt">Cloud: Synced</span>
        </button>
        <button onclick="toggleDoorState()" id="btn-sim-door" class="px-1.5 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs flex items-center gap-1">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400" id="door-ind"></span>
          <span id="door-txt">Lock: Closed</span>
        </button>
      </div>
    </div>

    <!-- Center Display Area (Pure LCD TFT 320x240 - No Bezel, No BTNs, BG White) -->
    <div class="flex justify-center items-center py-2">
      <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 shadow-sm flex flex-col items-center gap-2">
        <div class="relative rounded-lg overflow-hidden border border-slate-300 shadow-md bg-black" style="width: 320px; height: 240px;">
          <canvas id="inlineCanvas" width="320" height="240" class="pixelated block cursor-pointer" style="width: 320px; height: 240px;"></canvas>
        </div>
        <div class="flex items-center gap-1.5 text-[11px] text-slate-500 font-mono">
          <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="status-bar-caption">Direct Touch Enabled • Tap LCD cards to activate</span>
        </div>
      </div>
    </div>

    <!-- Screen Switcher Pills: Group 1 (Delivery Sequence - Unified Cards) -->
    <div class="bg-slate-50 border border-slate-200 rounded-lg p-1.5 space-y-1">
      <div class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider px-1">Delivery Flow Sequence:</div>
      <div class="flex flex-wrap items-center gap-1 text-[11px]">
        <button onclick="setScreen('DROP_PROMPT')" id="scr-DROP_PROMPT" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">1. Place & Drop</button>
        <span class="text-slate-400 font-bold">›</span>
        <button onclick="setScreen('DELIVERED')" id="scr-DELIVERED" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">2. Delivered (Ultrasonic)</button>
        <span class="text-slate-400 font-bold">›</span>
        <button onclick="setScreen('CLOSE_DOOR')" id="scr-CLOSE_DOOR" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">3. Please Close Door</button>
        <span class="text-slate-400 font-bold">›</span>
        <button onclick="setScreen('THANKYOU')" id="scr-THANKYOU" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">4. Thank you.</button>
      </div>
    </div>

    <!-- Screen Switcher Pills: Group 2 (Setup & Pairing Workflow) -->
    <div class="bg-slate-50 border border-slate-200 rounded-lg p-1.5 space-y-1">
      <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider px-1">Setup & Pairing Workflow:</div>
      <div class="flex flex-wrap items-center gap-1 text-[11px]">
        <button onclick="setScreen('SETUP_PROMPT')" id="scr-SETUP_PROMPT" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">1. Setup Prompt</button>
        <span class="text-slate-400 font-bold">›</span>
        <button onclick="setScreen('SETUP_BLE')" id="scr-SETUP_BLE" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">2. BLE Wi-Fi Setup</button>
        <span class="text-slate-400 font-bold">›</span>
        <button onclick="setScreen('SETUP_QR')" id="scr-SETUP_QR" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">3. Pairing QR & PIN</button>
        <span class="text-slate-400 font-bold">›</span>
        <button onclick="setScreen('SETUP_SUCCESS')" id="scr-SETUP_SUCCESS" class="scr-pill px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">4. Device Paired</button>
      </div>
    </div>

    <!-- Screen Switcher Pills: Group 3 (Base & Mobile App Controls) -->
    <div class="flex flex-wrap items-center justify-center gap-1.5 pt-0.5 text-xs">
      <button onclick="setScreen('HOME')" id="scr-HOME" class="scr-pill px-2.5 py-1 rounded-md bg-cyan-600 text-white border border-cyan-600 font-semibold shadow-xs font-medium">Home</button>
      <button onclick="setScreen('SCANNER')" id="scr-SCANNER" class="scr-pill px-2.5 py-1 rounded-md bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">Scanner</button>
      <button onclick="setScreen('UNLOCKED')" id="scr-UNLOCKED" class="scr-pill px-2.5 py-1 rounded-md bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">Mobile: Unlocked</button>
      <button onclick="setScreen('LOCKED')" id="scr-LOCKED" class="scr-pill px-2.5 py-1 rounded-md bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">Mobile: Locked</button>
      <button onclick="setScreen('ERROR')" id="scr-ERROR" class="scr-pill px-2.5 py-1 rounded-md bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">Scan Rejected</button>
      <button onclick="setScreen('ROBOT')" id="scr-ROBOT" class="scr-pill px-2.5 py-1 rounded-md bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs">Lockscreen</button>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('inlineCanvas');
    const ctx = canvas.getContext('2d');

    let currentScreen = 'HOME';
    let currentTheme = 'tesla';
    let statusStyle = 'MC'; // Center Floating [WiFi, Cloud, Lock]
    let isDoorOpen = false;
    let isWifiOnline = true;
    let isCloudConnected = true; // Independent: true = synced (green), false = still connecting (red)
    let isReceivingMode = true; // true = Drop-Off (Cyan), false = Pick-Up (Crimson)
    let scannerStyle = 'single'; // Bold Single Chevron
    let robotOffsetX = 0, wander = 0;
    let flowTimer = null;
    let flowRunning = false;

    const THEMES = {
      tesla: {
        name: "Tesla Luxury Automotive Tech",
        bg: '#05070a', card: '#0f131a', border: '#1f2937', accent: '#00f0ff', drop: '#00f0ff', warn: '#e11d48',
        grey: '#64748b', text: '#ffffff', gold: '#fbbf24', green: '#10b981',
        btnW: 106, btnH: 142, btnCY: 132, btnR: 8, barH: 26
      },
      nordic: {
        name: "Nordic Smart Home (Nest / HomeKit)",
        bg: '#0f172a', card: '#1e293b', border: '#334155', accent: '#2dd4bf', drop: '#14b8a6', warn: '#f43f5e',
        grey: '#94a3b8', text: '#f8fafc', gold: '#fbbf24', green: '#10b981',
        btnW: 104, btnH: 140, btnCY: 132, btnR: 18, barH: 26
      },
      logistics: {
        name: "Amazon Hub / InPost Locker",
        bg: '#020617', card: '#0f172a', border: '#f59e0b', accent: '#fbbf24', drop: '#f59e0b', warn: '#38bdf8',
        grey: '#cbd5e1', text: '#ffffff', gold: '#f59e0b', green: '#22c55e',
        btnW: 108, btnH: 142, btnCY: 132, btnR: 10, barH: 26
      },
      bento: {
        name: "Material You / Bento Tiles",
        bg: '#0a0d14', card: '#161c29', border: '#4f46e5', accent: '#6366f1', drop: '#6366f1', warn: '#10b981',
        grey: '#94a3b8', text: '#ffffff', gold: '#f59e0b', green: '#10b981',
        btnW: 106, btnH: 140, btnCY: 132, btnR: 22, barH: 26
      },
      braun: {
        name: "Braun Dieter Rams Industrial",
        bg: '#141414', card: '#222222', border: '#444444', accent: '#ff6b35', drop: '#ff6b35', warn: '#e5e5e5',
        grey: '#888888', text: '#ffffff', gold: '#ffaa00', green: '#22c55e',
        btnW: 104, btnH: 138, btnCY: 134, btnR: 6, barH: 24
      }
    };

    function toggleDoorState() {
      isDoorOpen = !isDoorOpen;
      document.getElementById('door-txt').textContent = isDoorOpen ? 'Lock: OPEN' : 'Lock: Closed';
      document.getElementById('door-ind').className = isDoorOpen ? 'h-1.5 w-1.5 rounded-full bg-amber-400' : 'h-1.5 w-1.5 rounded-full bg-emerald-400';
      render();
    }

    function toggleWifiState() {
      isWifiOnline = !isWifiOnline;
      document.getElementById('wifi-txt').textContent = isWifiOnline ? 'WiFi: Online' : 'WiFi: Offline';
      document.getElementById('wifi-ind').className = isWifiOnline ? 'h-1.5 w-1.5 rounded-full bg-emerald-400' : 'h-1.5 w-1.5 rounded-full bg-rose-400';
      render();
    }

    function toggleCloudState() {
      isCloudConnected = !isCloudConnected;
      document.getElementById('cloud-txt').textContent = isCloudConnected ? 'Cloud: Synced' : 'Cloud: Connecting';
      document.getElementById('cloud-ind').className = isCloudConnected ? 'h-1.5 w-1.5 rounded-full bg-emerald-400' : 'h-1.5 w-1.5 rounded-full bg-rose-400 animate-pulse';
      render();
    }

    function setTheme(t) {
      currentTheme = t;
      document.querySelectorAll('.theme-chip').forEach(btn => {
        btn.className = 'theme-chip px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs';
      });
      const active = document.getElementById('btn-theme-' + t);
      if (active) active.className = 'theme-chip px-2 py-0.5 rounded bg-cyan-600 text-white border border-cyan-600 font-semibold shadow-xs font-semibold';
      
      const T = THEMES[t];
      const d1 = document.getElementById('btn1-dot'); if (d1) d1.style.backgroundColor = T.drop;
      const d2 = document.getElementById('btn2-dot'); if (d2) d2.style.backgroundColor = T.warn;
      render();
    }

    function updateCaption(text) {
      const cap = document.getElementById('status-bar-caption');
      if (cap) cap.textContent = text;
    }

    function setScreen(s) {
      currentScreen = s;
      if (s === 'UNLOCKED' || s === 'DROP_PROMPT' || s === 'DELIVERED' || s === 'CLOSE_DOOR') {
        isDoorOpen = true;
      } else if (s === 'LOCKED' || s === 'THANKYOU' || s === 'HOME' || s === 'ROBOT' || s === 'SCANNER') {
        isDoorOpen = false;
      }

      document.getElementById('door-txt').textContent = isDoorOpen ? 'Lock: OPEN' : 'Lock: Closed';
      document.getElementById('door-ind').className = isDoorOpen ? 'h-1.5 w-1.5 rounded-full bg-amber-400' : 'h-1.5 w-1.5 rounded-full bg-emerald-400';

      document.querySelectorAll('.scr-pill').forEach(btn => {
        btn.className = 'scr-pill px-2.5 py-1 rounded-md bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 shadow-xs';
      });
      const active = document.getElementById('scr-' + s);
      if (active) active.className = 'scr-pill px-2.5 py-1 rounded-md bg-cyan-600 text-white border border-cyan-600 font-semibold shadow-xs font-medium';

      if (s === 'UNLOCKED') updateCaption("1. UNLOCKED (Pure Minimalist, 2s)");
      else if (s === 'DROP_PROMPT') updateCaption("2. Place & Drop the parcel inside");
      else if (s === 'DELIVERED') updateCaption("3. Parcel Delivered (Ultrasonic Trigger)");
      else if (s === 'CLOSE_DOOR') updateCaption("4. Please close the door (Reed Sensor)");
      else if (s === 'LOCKED') updateCaption("5. LOCKED (Pure Minimalist, 2s)");
      else if (s === 'THANKYOU') updateCaption("6. Thank you. (Complete)");
      else if (s === 'SCANNER') updateCaption("Scanner: Please scan Parcel QR below");
      else if (s === 'HOME') updateCaption("Home: Idle Standby");

      render();
    }

    function runDeliveryFlow() {
      if (flowRunning) {
        clearTimeout(flowTimer);
        flowRunning = false;
        document.getElementById('flow-icon').textContent = '▶';
        document.getElementById('flow-txt').textContent = 'Play 2s Delivery Flow';
        document.getElementById('flow-status-badge').textContent = 'Stopped';
        return;
      }

      flowRunning = true;
      document.getElementById('flow-icon').textContent = '⏹';
      document.getElementById('flow-txt').textContent = 'Stop Flow';

      const sequence = [
        { screen: 'DROP_PROMPT', delay: 2000, label: 'Step 1/4: Place & Drop (2.0s)' },
        { screen: 'DELIVERED', delay: 2000, label: 'Step 2/4: Parcel Delivered (2.0s)' },
        { screen: 'CLOSE_DOOR', delay: 2000, label: 'Step 3/4: Close Door (2.0s)' },
        { screen: 'THANKYOU', delay: 2000, label: 'Step 4/4: Thank you. (2.0s)' },
        { screen: 'HOME', delay: 1000, label: 'Completed -> Home' }
      ];

      let step = 0;
      function nextStep() {
        if (!flowRunning) return;
        if (step >= sequence.length) {
          flowRunning = false;
          document.getElementById('flow-icon').textContent = '▶';
          document.getElementById('flow-txt').textContent = 'Play 2s Delivery Flow';
          document.getElementById('flow-status-badge').textContent = 'Finished';
          return;
        }

        const current = sequence[step];
        setScreen(current.screen);
        document.getElementById('flow-status-badge').textContent = current.label;
        step++;

        if (step < sequence.length) {
          flowTimer = setTimeout(nextStep, current.delay);
        } else {
          flowTimer = setTimeout(() => {
            setScreen('HOME');
            flowRunning = false;
            document.getElementById('flow-icon').textContent = '▶';
            document.getElementById('flow-txt').textContent = 'Play 2s Delivery Flow';
            document.getElementById('flow-status-badge').textContent = 'Ready';
          }, current.delay);
        }
      }

      nextStep();
    }

    let setupFlowRunning = false;
    let setupFlowTimer = null;

    function runSetupFlow() {
      if (setupFlowRunning) {
        clearTimeout(setupFlowTimer);
        setupFlowRunning = false;
        document.getElementById('setup-flow-icon').textContent = '▶';
        document.getElementById('setup-flow-txt').textContent = 'Setup Flow';
        document.getElementById('flow-status-badge').textContent = 'Stopped';
        return;
      }
      if (flowRunning) {
        clearTimeout(flowTimer);
        flowRunning = false;
        document.getElementById('flow-icon').textContent = '▶';
        document.getElementById('flow-txt').textContent = 'Delivery Flow';
      }

      setupFlowRunning = true;
      document.getElementById('setup-flow-icon').textContent = '⏹';
      document.getElementById('setup-flow-txt').textContent = 'Stop Setup';

      const sequence = [
        { screen: 'SETUP_PROMPT', delay: 2500, label: 'Step 1/4: Setup Prompt (Press BTN 1)' },
        { screen: 'SETUP_BLE', delay: 3000, label: 'Step 2/4: BLE Wi-Fi Setup QR' },
        { screen: 'SETUP_QR', delay: 3500, label: 'Step 3/4: Pairing QR & PIN (CODE: 482-913)' },
        { screen: 'SETUP_SUCCESS', delay: 2500, label: 'Step 4/4: Device Paired!' },
        { screen: 'HOME', delay: 1000, label: 'Setup Done -> Home' }
      ];

      let step = 0;
      function nextSetupStep() {
        if (!setupFlowRunning) return;
        if (step >= sequence.length) {
          setupFlowRunning = false;
          document.getElementById('setup-flow-icon').textContent = '▶';
          document.getElementById('setup-flow-txt').textContent = 'Setup Flow';
          document.getElementById('flow-status-badge').textContent = 'Setup Complete';
          return;
        }

        const current = sequence[step];
        setScreen(current.screen);
        document.getElementById('flow-status-badge').textContent = current.label;
        step++;

        if (step < sequence.length) {
          setupFlowTimer = setTimeout(nextSetupStep, current.delay);
        } else {
          setupFlowTimer = setTimeout(() => {
            setScreen('HOME');
            setupFlowRunning = false;
            document.getElementById('setup-flow-icon').textContent = '▶';
            document.getElementById('setup-flow-txt').textContent = 'Setup Flow';
            document.getElementById('flow-status-badge').textContent = 'Ready';
          }, current.delay);
        }
      }

      nextSetupStep();
    }

    function simulateBtn1() {
      if (currentScreen === 'HOME') {
        isReceivingMode = true;
        setScreen('SCANNER');
      } else if (currentScreen === 'SCANNER') {
        // Trigger delivery flow on valid scan simulation!
        runDeliveryFlow();
      } else if (currentScreen === 'SETUP_PROMPT' || currentScreen === 'SETUP') {
        setScreen('SETUP_BLE');
      } else if (currentScreen === 'SETUP_BLE') {
        setScreen('SETUP_QR');
      } else if (currentScreen === 'SETUP_QR') {
        setScreen('SETUP_SUCCESS');
      } else {
        setScreen('HOME');
      }
    }

    function simulateBtn2() {
      if (currentScreen === 'HOME') {
        isReceivingMode = false;
        setScreen('SCANNER');
      } else {
        if (flowRunning) {
          clearTimeout(flowTimer);
          flowRunning = false;
          document.getElementById('flow-icon').textContent = '▶';
          document.getElementById('flow-txt').textContent = 'Delivery Flow';
          document.getElementById('flow-status-badge').textContent = 'Canceled';
        }
        if (setupFlowRunning) {
          clearTimeout(setupFlowTimer);
          setupFlowRunning = false;
          document.getElementById('setup-flow-icon').textContent = '▶';
          document.getElementById('setup-flow-txt').textContent = 'Setup Flow';
          document.getElementById('flow-status-badge').textContent = 'Canceled';
        }
        setScreen('HOME');
      }
    }

    // --- Adafruit_GFX integer drawing primitives ---
    function fillRect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h)); }
    function drawRect(x, y, w, h, col) { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(Math.floor(x) + 0.5, Math.floor(y) + 0.5, Math.floor(w) - 1, Math.floor(h) - 1); }
    function fillRoundRect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h), Math.min(r, w/2, h/2)); ctx.fill(); }
    function drawRoundRect(x, y, w, h, r, col) { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(Math.floor(x) + 0.5, Math.floor(y) + 0.5, Math.floor(w) - 1, Math.floor(h) - 1, Math.min(r, w/2, h/2)); ctx.stroke(); }
    function drawLine(x1, y1, x2, y2, col) { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.floor(x1) + 0.5, Math.floor(y1) + 0.5); ctx.lineTo(Math.floor(x2) + 0.5, Math.floor(y2) + 0.5); ctx.stroke(); }
    function fillCircle(cx, cy, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
    function drawCircle(cx, cy, r, col) { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
    function text(s, x, y, col, isBold, size) { ctx.font = `${isBold ? 'bold ' : ''}${size || 12}px sans-serif`; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); }

    function drawCloudIcon(cx, cy, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx - 3.5, cy + 0.5, 3, 0, Math.PI * 2);
      ctx.arc(cx, cy - 2, 4, 0, Math.PI * 2);
      ctx.arc(cx + 4, cy + 0.5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      fillRect(cx - 5.5, cy + 1, 11, 2.5, color);
    }

    function drawIconGear(cx, cy, color, bgColor) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0, Math.PI * 2);
      ctx.fill();
      for (let i = 0; i < 8; i++) {

        ctx.fillRect(-2.5, -2.5, 5, 5);

      ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);

    // ── Interactive Touchscreen Simulation ─────────────────────────
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = 320 / rect.width;
      const scaleY = 240 / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    let touchRipple = null;
    function triggerTouchFeedback(x, y) {
      touchRipple = { x, y, r: 6, alpha: 0.8 };
      function drawRipple() {
        if (!touchRipple) return;
        ctx.save();
        ctx.strokeStyle = `rgba(0, 240, 255, ${touchRipple.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(touchRipple.x, touchRipple.y, touchRipple.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        touchRipple.r += 4;
        touchRipple.alpha -= 0.15;
        if (touchRipple.alpha > 0) {
          requestAnimationFrame(drawRipple);
        } else {
          touchRipple = null;
          render();
        }
      }
      requestAnimationFrame(drawRipple);
    }

    canvas.addEventListener('click', (e) => {
      const { x, y } = getCanvasCoords(e);
      triggerTouchFeedback(x, y);

      switch (currentScreen) {
        case 'HOME':
          // Left Card (Drop-Off)
          if (x >= 15 && x <= 155 && y >= 30 && y <= 225) {
            isReceivingMode = true;
            setScreen('SCANNER');
          }
          // Right Card (Pick-Up)
          else if (x >= 165 && x <= 305 && y >= 30 && y <= 225) {
            isReceivingMode = false;
            setScreen('SCANNER');
          }
          break;

        case 'SCANNER':
          // Exit button pill at bottom
          if (y >= 195 && y <= 235 && x >= 90 && x <= 230) {
            setScreen('HOME');
          }
          // Center QR scanning area -> trigger simulated parcel scan & delivery sequence
          else if (y >= 45 && y <= 190 && x >= 80 && x <= 240) {
            runDeliveryFlow();
          }
          break;

        case 'SETUP_PROMPT':
        case 'SETUP':
          // "Begin Setup" button
          if (y >= 155 && y <= 205 && x >= 85 && x <= 235) {
            setScreen('SETUP_BLE');
          }
          break;

        case 'SETUP_BLE':
          // Cancel button pill at bottom
          if (y >= 195 && y <= 235 && x >= 85 && x <= 235) {
            setScreen('SETUP_PROMPT');
          }
          // BLE Active pill or QR plate -> advance to QR pairing
          else if (y >= 45 && y <= 190 && x >= 80 && x <= 240) {
            setScreen('SETUP_QR');
          }
          break;

        case 'SETUP_QR':
        case 'QR':
          // Cancel button pill
          if (y >= 185 && y <= 235 && x >= 40 && x <= 280) {
            setScreen('SETUP_PROMPT');
          }
          // QR code or code area -> simulate pairing complete!
          else if (y >= 45 && y <= 180 && x >= 80 && x <= 240) {
            setScreen('SETUP_SUCCESS');
          }
          break;

        case 'DROP_PROMPT':
          setScreen('DELIVERED');
          break;

        case 'DELIVERED':
          setScreen('CLOSE_DOOR');
          break;

        case 'CLOSE_DOOR':
          setScreen('THANKYOU');
          break;

        case 'THANKYOU':
        case 'SETUP_SUCCESS':
        case 'UNLOCKED':
        case 'LOCKED':
        case 'ERROR':
        case 'ROBOT':
        default:
          setScreen('HOME');
          break;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const { x, y } = getCanvasCoords(e);
      let isPointer = false;

      if (currentScreen === 'HOME') {
        if ((x >= 15 && x <= 155 && y >= 30 && y <= 225) ||
            (x >= 165 && x <= 305 && y >= 30 && y <= 225)) {
          isPointer = true;
        }
      } else if (currentScreen === 'SCANNER') {
        if ((y >= 195 && y <= 235 && x >= 90 && x <= 230) ||
            (y >= 45 && y <= 190 && x >= 80 && x <= 240)) {
          isPointer = true;
        }
      } else if (currentScreen === 'SETUP_PROMPT' || currentScreen === 'SETUP') {
        if (y >= 155 && y <= 205 && x >= 85 && x <= 235) isPointer = true;
      } else if (currentScreen === 'SETUP_BLE') {
        if ((y >= 195 && y <= 235 && x >= 85 && x <= 235) ||
            (y >= 45 && y <= 190 && x >= 80 && x <= 240)) isPointer = true;
      } else if (currentScreen === 'SETUP_QR' || currentScreen === 'QR') {
        if (y >= 40 && y <= 235) isPointer = true;
      } else {
        isPointer = true;
      }

      canvas.style.cursor = isPointer ? 'pointer' : 'default';
    });

    setTheme('tesla');
    setScreen('HOME');
  </script>
</body>
</html>
